[tools]
# Pinned, not "latest": CI, the deploy job, and this machine have to agree on
# the version that resolved bun.lock, or `--frozen-lockfile` is enforcing a
# lockfile a different Bun wrote.
bun = "1.4.0"
# Matches "engines" in functions/package.json — the Functions emulator runs
# the code on the local Node, so CI and dev should run what production runs.
node = "22"
