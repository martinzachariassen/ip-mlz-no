name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: what-is-my-ip-f7210

permissions:
  contents: read
  id-token: write

# An in-flight run finishes rather than shipping half-uploaded assets.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run lint

      - name: Check firebase.json headers, cache policy, and /ip
        run: ./scripts/verify.sh

  deploy:
    name: deploy to Cloud Run + Firebase Hosting
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ip.mlz.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up tools from mise.toml
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Impersonation yields a plain OAuth token; firebase-tools has failed on
      # raw external_account credential files.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy Cloud Run service
        run: >
          gcloud run deploy ip-go
          --source server
          --project "$PROJECT"
          --region europe-west1
          --service-account "ip-go-runtime@$PROJECT.iam.gserviceaccount.com"
          --min-instances 0
          --max-instances 1
          --concurrency 250
          --timeout 10
          --cpu 1
          --memory 256Mi
          --ingress all
          --allow-unauthenticated
          --quiet

      - name: Deploy Hosting
        run: bunx firebase-tools deploy --only hosting --project "$PROJECT" --non-interactive
