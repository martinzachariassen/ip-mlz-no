name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: what-is-my-ip-f7210

permissions:
  contents: read
  id-token: write

# An in-flight run finishes rather than shipping half-uploaded assets.
concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun + Node from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run lint

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Check firebase.json headers, cache policy, and /ip
        run: ./scripts/verify.sh

  deploy:
    name: deploy to Firebase Hosting + Functions
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ip.mlz.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun + Node from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      # Impersonation yields a plain OAuth token; firebase-tools has failed on
      # raw external_account credential files.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy
        run: bunx firebase-tools deploy --only hosting,functions --project "$PROJECT" --non-interactive
