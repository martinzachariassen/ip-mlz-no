name: Preview

# Deploys public/ to a temporary Firebase Hosting preview channel for every
# PR. This catches what CI's emulator run can't: a broken GCP login (WIF
# condition, service-account binding) or missing Hosting permissions. Merging
# to main means shipping to prod, so that breakage has to show up here first.
#
# Only Hosting goes to the channel. Preview channels can't host functions, so
# /ip on the preview URL calls the live production function.
#
# Same keyless WIF auth and repo variables as deploy.yml, but without the
# protected `production` environment. `deploy-preview` is a required check
# on main (infra/github.tf).
on:
  pull_request:

env:
  PROJECT: what-is-my-ip-f7210

permissions:
  contents: read
  # Required for GitHub to mint the OIDC token that WIF exchanges.
  id-token: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: deploy-preview
    # GitHub doesn't give fork or Dependabot PRs an OIDC token, so the login
    # would fail. Neither changes the deploy setup, so skip them (a skipped
    # job counts as passing).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise (installs Bun + Node from mise.toml)
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # One channel per PR, reused on every push, deleted automatically after
      # 7 days so nothing piles up.
      - name: Deploy to preview channel
        id: deploy
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          out="$(bunx firebase-tools hosting:channel:deploy "$CHANNEL" \
            --expires 7d --project "$PROJECT" --non-interactive --json)"
          url="$(jq -r '.result[].url' <<< "$out" | head -n 1)"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "$out"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (expires in 7 days)" >> "$GITHUB_STEP_SUMMARY"

      # Cheap check that the channel really serves this PR's files with the
      # security headers attached.
      - name: Smoke test preview
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -sfI "$URL/" | grep -qi '^content-security-policy:'
          curl -sf "$URL/ip" | grep -qE '^[0-9a-fA-F:.]+$'
