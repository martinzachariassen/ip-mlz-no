version: 2

updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR per week keeps the noise down
    groups:
      bun:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    groups:
      functions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  # Provider versions in infra/ (versions.tf + .terraform.lock.hcl). CI only
  # validates them: run `terraform plan` locally before merging these.
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    groups:
      terraform:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
